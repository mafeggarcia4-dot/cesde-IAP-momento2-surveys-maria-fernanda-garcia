<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>
<body>

    <form>
        <fieldset>
            <label for="">Nombre <br>
                <input type="text" required placeholder="Ingresar nombre">
            </label>
            <br>
            <label for="">Correo <br>
                <input type="email" required placeholder="Ingresar correo">
            </label>
            <br>
           <label for="">Género: <br>
                <input type="radio" name="genero"> Femenino <br>
                 <input type="radio" name="genero"> Masculino <br>
                <input type="radio" name="genero"> Otro <br>
            </label>
                <br>
            <label for="">Hobbies <br>
                <input type="checkbox"> Deportes <br>
                <input type="checkbox"> Viajar <br>
                <input type="checkbox"> Cocinar <br>
                <input type="checkbox"> Música <br>
            </label>
            <br>

            <label for="">Edad:
                    <select>
                        <option></option>
                        <option>Menos de 18 años</option>
                        <option>Entre 18 y 25 años</option>
                        <option>Entre 26 y 35 años</option>
                        <option>Más de 35 años</option>
            </label>
                <br>

                <p>
                <label>Comentarios Adicionales:</label>
                <textarea></textarea>
                </p>
               

                <button type="submit">Enviar</button>

                    


        </fieldset>


    </form>

    
</body>
</html>
